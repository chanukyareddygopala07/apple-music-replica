name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # E2E gate. playwright.config.ts builds its own credential-less app
      # (webServer forces VITE_AUDIUS_ENABLED=0; this step sets no provider
      # vars, so Jamendo/MusicKit/YouTube stay unconfigured = zero requests)
      # and previews it on 127.0.0.1:4173. It must run BEFORE the deploy
      # build below: test:e2e rebuilds dist/ without VITE_BASE, so it cannot
      # be allowed to overwrite the /apple-music-replica/ artifact we ship.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_BASE: /apple-music-replica/
          # Realaxify backend origin (public configuration, not a secret).
          # The Pages build calls the deployed Render API cross-origin; CORS
          # on the backend allows this exact origin. Local dev leaves it unset
          # and uses the vite /api proxy → http://127.0.0.1:8000 (see
          # .env.example). Trailing slashes are normalised by the client.
          VITE_API_BASE: https://realaxify.onrender.com
          # Audius is the default-on external provider; these Actions
          # *variables* (not secrets) override it — empty = anonymous
          # default-on behaviour. Set VITE_AUDIUS_ENABLED=0 to ship demo-only.
          VITE_AUDIUS_ENABLED: ${{ vars.VITE_AUDIUS_ENABLED }}
          VITE_AUDIUS_API_KEY: ${{ vars.VITE_AUDIUS_API_KEY }}
          # Jamendo (free CC provider) — optional repo Actions *variables*
          # (not secrets). Empty VITE_JAMENDO_CLIENT_ID = the Jamendo source
          # is simply not offered in production (zero requests, app unchanged).
          VITE_JAMENDO_ENABLED: ${{ vars.VITE_JAMENDO_ENABLED }}
          VITE_JAMENDO_CLIENT_ID: ${{ vars.VITE_JAMENDO_CLIENT_ID }}
          # YouTube discovery key (public Actions *variable*, not a secret —
          # referrer-restrict the key in Google Cloud). Empty =
          # VITE_YOUTUBE_API_KEY = the YouTube source is not offered (zero
          # requests); /watch still plays the official embed keylessly.
          VITE_YOUTUBE_ENABLED: ${{ vars.VITE_YOUTUBE_ENABLED }}
          VITE_YOUTUBE_API_KEY: ${{ vars.VITE_YOUTUBE_API_KEY }}
          # Public MusicKit config (repo Actions *variables*, not secrets).
          # Empty until `gh variable set ...` — empty gate = demo unchanged.
          VITE_MUSICKIT_ENABLED: ${{ vars.VITE_MUSICKIT_ENABLED }}
          VITE_MUSICKIT_TOKEN_URL: ${{ vars.VITE_MUSICKIT_TOKEN_URL }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # FastAPI backend gate: ruff + 83 pytest tests + the Playwright suite that
  # runs the real app against a live uvicorn (npm run test:e2e:api). Runs in
  # parallel with `build`; the deploy job below waits for both.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      # --extra dev pulls pytest + ruff (optional-dependencies.dev)
      - run: uv sync --directory backend --extra dev
      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Boots backend/.venv/bin/uvicorn on :8000 + a preview build on :4174
      # (VITE_API_ENABLED=1, browser providers off — everything remote must
      # come through the API, proving the integration rather than the
      # direct-provider fallback).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:api
  deploy:
    # Pages ships only when both gates are green: the frontend build and the
    # backend API suite.
    needs: [build, backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
